# fly.toml app configuration file generated for myak-biplane on 2026-11-23T17:05:32Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'myak-biplane'
primary_region = 'fra'

[build]
  dockerfile = 'MyaKBiplane.Server/Dockerfile'

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
