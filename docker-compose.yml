# Release-оркестрация MyaK Biplane.
#
# Перед запуском скопируйте .env.example в .env и заполните значения:
#   docker compose up -d --build
#
# Клиент — Blazor WASM за nginx, сервер — ASP.NET Core + SignalR.
# Сервер подключён к внешней сети shared-net, чтобы видеть общий PostgreSQL.
name: myak-biplane

services:
  server:
    container_name: myak-biplane-server-container
    image: ${DOCKER_REGISTRY-}myak-biplane-server
    build:
      context: .
      dockerfile: MyaKBiplane.Server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - server-logs:/app/Data/Logs
    networks:
      - default
      - shared-net

  client:
    container_name: myak-biplane-client-container
    image: ${DOCKER_REGISTRY-}myak-biplane-client
    build:
      context: .
      dockerfile: MyaKBiplane.Client/Dockerfile
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8081}:80"
    depends_on:
      - server
    networks:
      - default

networks:
  shared-net:
    external: true

volumes:
  server-logs:
