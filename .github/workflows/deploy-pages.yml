name: Deploy client to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages требует эти разрешения для деплоя через actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно может идти только один деплой; новый отменяет предыдущий.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Для project-сайта https://<user>.github.io/<repo>/.
  # Для сайта пользователя https://<user>.github.io/ укажите "/".
  PAGES_BASE_PATH: /MyaK-Biplane/

jobs:
  build:
    runs-on: ubuntu-latest
    # SERVER_BASE_URL может храниться как переменная окружения github-pages.
    # Без этой строки vars.SERVER_BASE_URL в build-джобе пустая.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Для подсчёта версии нужна вся история, а не только последний коммит.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Blazor client
        run: dotnet publish MyaKBiplane.Client/MyaKBiplane.Client.csproj -c Release -o publish

      - name: Set Pages base path
        run: |
          index="publish/wwwroot/index.html"
          grep -q '<base href="/" />' "$index" || {
            echo "::error::В опубликованном index.html не найден <base href=\"/\" />"
            exit 1
          }
          sed -i "s#<base href=\"/\" />#<base href=\"${PAGES_BASE_PATH}\" />#" "$index"
          rm -f "$index.br" "$index.gz"

      # Версия 0.<МИНОР>.<ПАТЧ>[-dev]:
      #   МИНОР — количество слияний в master, растёт только при merge в master;
      #   ПАТЧ  — при слиянии обнуляется и становится равным числу коммитов
      #           в слитой ветке; при прямых коммитах в master — коммиты
      #           после последнего слияния;
      #   -dev  — добавляется для сборок не из master.
      - name: Compute project version
        run: |
          merges=$(git rev-list --merges --count HEAD)
          branch="${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          suffix=""

          if [ "$branch" != "master" ]; then
            if git rev-parse --verify origin/master >/dev/null 2>&1; then
              base=origin/master
            else
              base=master
            fi
            commits=$(git rev-list --count "$base"..HEAD)
            suffix="-dev"
          elif git rev-parse HEAD^2 >/dev/null 2>&1; then
            # Merge в master: patch = коммиты, пришедшие из ветки.
            commits=$(git rev-list --count HEAD^1..HEAD^2)
          else
            last_merge=$(git rev-list --merges -n 1 HEAD)
            if [ -z "$last_merge" ]; then
              last_merge=$(git rev-list --max-parents=0 HEAD)
            fi
            commits=$(git rev-list --count "$last_merge"..HEAD)
          fi

          version="0.${merges}.${commits}${suffix}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Project version: $version"

      - name: Configure game server
        env:
          SERVER_BASE_URL: ${{ vars.SERVER_BASE_URL }}
        run: |
          if [ -z "$SERVER_BASE_URL" ]; then
            echo "::error::Не задана переменная SERVER_BASE_URL."
            echo "Settings → Secrets and variables → Actions → Variables:"
            echo "создайте переменную на уровне репозитория или окружения github-pages."
            echo "Значение — HTTPS-адрес MyaKBiplane.Server, например https://myak-biplane.example.com"
            exit 1
          fi

          case "$SERVER_BASE_URL" in
            https://*) ;;
            *)
              echo "::error::SERVER_BASE_URL должен начинаться с https:// — GitHub Pages работает по HTTPS."
              exit 1
              ;;
          esac

          cat > publish/wwwroot/appsettings.json <<EOF
          {
            "Server": {
              "BaseUrl": "$SERVER_BASE_URL"
            },
            "App": {
              "Version": "$APP_VERSION"
            }
          }
          EOF

          rm -f publish/wwwroot/appsettings.json.br publish/wwwroot/appsettings.json.gz

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages не умеет fallback на index.html, поэтому глубокие ссылки
          # (/play, /not-found) обслуживаются через 404.html с тем же приложением.
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          # Без .nojekyll Pages может выбросить каталог _framework.
          touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
